[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "awaaz"
version = "0.1.0"
description = "Hinglish voice pipeline — number and date expansion, code-switch routing, voiceover scripting and SSML. Offline, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Chirag Solanki"}]
keywords = ["hindi", "hinglish", "tts", "ssml", "voice", "text-to-speech",
            "indic", "devanagari", "code-switching", "voiceover", "india"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Hindi",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.scripts]
awaaz = "awaaz.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["awaaz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
